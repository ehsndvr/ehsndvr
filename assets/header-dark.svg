<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Ehsan Davari — Software Developer</title>
  <desc id="d">Bot frameworks, backend and automation. Creator of baleio.</desc>
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="360" rx="24"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F19"/>
      <stop offset="1" stop-color="#0F1626"/>
    </linearGradient>
    <linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
      <animate attributeName="x1" values="-1200;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1200" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="70"/></filter>
    <style>
      .sans{font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
      .g1{animation:drift1 16s ease-in-out infinite}
      .g2{animation:drift2 20s ease-in-out infinite}
      .l{opacity:0;animation:reveal .6s cubic-bezier(.2,.7,.2,1) forwards}
      .l1{animation-delay:.35s}.l2{animation-delay:.6s}.l3{animation-delay:.85s}.l4{animation-delay:1.1s}.l5{animation-delay:1.35s}.l6{animation-delay:1.6s}
      .cur{animation:blink 1.1s steps(1,end) infinite}
      .dot{transform-origin:80px 70px;animation:pulse 2.4s ease-in-out infinite}
      @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,36px)}}
      @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-44px)}}
      @keyframes reveal{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}
      @media (prefers-reduced-motion:reduce){.g1,.g2,.l,.cur,.dot{animation:none}.l{opacity:1}}
    </style>
  </defs>

  <!-- card -->
  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <g class="g1"><circle cx="960" cy="40" r="230" fill="#7C5CFF" fill-opacity="0.34" filter="url(#blur)"/></g>
    <g class="g2"><circle cx="1180" cy="330" r="210" fill="#2DD4BF" fill-opacity="0.26" filter="url(#blur)"/></g>
    <rect x="0" y="356" width="1200" height="4" fill="url(#bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>

  <!-- handle chip -->
  <g>
    <rect x="64" y="56" width="118" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <circle class="dot" cx="80" cy="70" r="4" fill="#2DD4BF"/>
    <text x="93" y="74.5" class="mono" font-size="13" fill="#CBD5E1">@ehsndvr</text>
  </g>

  <!-- name + role -->
  <text x="62" y="158" class="sans" font-size="54" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Ehsan Davari</text>
  <text x="64" y="199" class="sans" font-size="21" font-weight="500" fill="#E2E8F0">Software Developer</text>

  <!-- focus chips -->
  <g class="sans" font-size="13.5" font-weight="500" fill="#CBD5E1">
    <rect x="64" y="228" width="130" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="129" y="249" text-anchor="middle">Bot frameworks</text>
    <rect x="204" y="228" width="130" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="269" y="249" text-anchor="middle">Backend &amp; APIs</text>
    <rect x="344" y="228" width="170" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="429" y="249" text-anchor="middle">Automation &amp; DevOps</text>
  </g>

  <!-- terminal line -->
  <g class="mono" font-size="15">
    <text x="64" y="316"><tspan fill="#2DD4BF">$</tspan><tspan fill="#94A3B8" dx="10">pip install</tspan><tspan fill="#F1F5F9" dx="8">baleio</tspan></text>
    <rect class="cur" x="262" y="303" width="9" height="17" rx="1.5" fill="#7C5CFF"/>
  </g>

  <!-- code window -->
  <g transform="translate(660 52)">
    <rect x="0.5" y="0.5" width="475" height="255" rx="14" fill="#0A0E18" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <path d="M0.5 36.5H475.5" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <circle cx="20" cy="18.5" r="5.5" fill="#FF5F57"/>
    <circle cx="38" cy="18.5" r="5.5" fill="#FEBC2E"/>
    <circle cx="56" cy="18.5" r="5.5" fill="#28C840"/>
    <text x="238" y="22.5" text-anchor="middle" class="mono" font-size="12" fill="#64748B">bot.py</text>
    <g class="mono" font-size="15">
      <text class="l l1" x="22" y="66"><tspan fill="#64748B"># baleio · async · routers · FSM · webhooks</tspan></text>
      <text class="l l2" x="22" y="96"><tspan fill="#C084FC">from</tspan><tspan fill="#E2E8F0" dx="9">baleio</tspan><tspan fill="#C084FC" dx="9">import</tspan><tspan fill="#E2E8F0" dx="9">Bot, Dispatcher</tspan></text>
      <text class="l l3" x="22" y="140"><tspan fill="#E2E8F0">dp</tspan><tspan fill="#94A3B8" dx="9">=</tspan><tspan fill="#7DD3FC" dx="9">Dispatcher</tspan><tspan fill="#94A3B8">()</tspan></text>
      <text class="l l4" x="22" y="184"><tspan fill="#F0ABFC">@dp.message</tspan><tspan fill="#94A3B8">()</tspan></text>
      <text class="l l5" x="22" y="210"><tspan fill="#C084FC">async def</tspan><tspan fill="#7DD3FC" dx="9">echo</tspan><tspan fill="#94A3B8">(</tspan><tspan fill="#E2E8F0">message</tspan><tspan fill="#94A3B8">):</tspan></text>
      <text class="l l6" x="22" y="236"><tspan fill="#C084FC" dx="36">await</tspan><tspan fill="#E2E8F0" dx="9">message.</tspan><tspan fill="#7DD3FC">answer</tspan><tspan fill="#94A3B8">(</tspan><tspan fill="#E2E8F0">message.text</tspan><tspan fill="#94A3B8">)</tspan></text>
    </g>
  </g>
</svg>
